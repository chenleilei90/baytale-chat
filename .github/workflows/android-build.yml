name: Build Android App (APK & AAB)

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Test & Build Android APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android SDK 35 & Build-Tools 35.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure release signing if GitHub Secrets exist
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/baychat-release.jks
            CLEAN_STORE_PASS=$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')
            CLEAN_KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')
            CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
            cat > keystore.properties << EOF
          storeFile=baychat-release.jks
          storePassword=$CLEAN_STORE_PASS
          keyAlias=$CLEAN_KEY_ALIAS
          keyPassword=$CLEAN_KEY_PASS
          EOF
            echo "Release signing configured from secrets. keystore_bytes=$(wc -c < app/baychat-release.jks)"
            # 立即验证密钥库、密码与别名，出错时 1 秒快速失败，不必等 Gradle 编译完
            keytool -list -v -keystore app/baychat-release.jks -alias "$CLEAN_KEY_ALIAS" -storepass "$CLEAN_STORE_PASS" | grep -E "Alias name|Entry type|Owner:|Valid from|SHA256:|SHA-256:"
          else
            echo "No release keystore secrets set; building release with fallback debug signing for direct testing."
          fi

      - name: Run Kotlin unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK, Release APK & Google Play AAB
        working-directory: android
        run: gradle assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Verify APK V1/V2/V3 signatures with apksigner
        working-directory: android
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          OUT=$("$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$OUT"
          echo "$OUT" | grep -q "Verified using v1 scheme (JAR signing): true"
          echo "$OUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          echo "$OUT" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          echo "=== META-INF V1 signature files ==="
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "META-INF/.*\.(MF|SF|RSA|DSA|EC)"

      - name: Summarize build artifacts
        working-directory: android
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab

      - name: Upload Debug & Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: baychat-android-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Google Play AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: baychat-google-play-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish public GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release_assets
          cp android/app/build/outputs/apk/release/app-release.apk "release_assets/BayChat-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "release_assets/BayChat-${TAG}-debug.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release_assets/BayChat-${TAG}.aab"
          gh release create "$TAG" release_assets/* \
            --title "BayChat Android ${TAG}" \
            --notes "BayChat 纯原生 Android 客户端（Kotlin + Jetpack Compose + 原生 WebRTC，与 https://chat.baytale.com 100% 互通）。\n\n- **手机直接安装**：下载 \`BayChat-${TAG}.apk\`\n- **Google Play 商店包**：\`BayChat-${TAG}.aab\`" \
            --latest || gh release upload "$TAG" release_assets/* --clobber
